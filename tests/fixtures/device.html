<script type="text/javascript">
//******************************************************************
function Get_mAddr(k,z,xmlData) {
	for(i = k; i < (k+z); i++){
		S1 = getXMLValue(xmlData, 'm' + i);
		document.getElementById('m' + i).innerHTML = S1;          //e.toString();  e.length();
	}
}

function Get_amAddr(k,z,xmlData) {
	for(i = k; i < (k+z); i++){
		s = getXMLValue(xmlData, 'am' + i);
		switch(s){
			case '2' : document.getElementById('am'+i).style.backgroundColor  =  'RED'; break;
			default : document.getElementById('am'+i).style.backgroundColor = (s == '1') ? '#009900' : '#c0c0c0';
		}
	}
}
