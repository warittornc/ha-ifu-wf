[project]
name = "ha-ifu-wf"
version = "0.1.0"
description = "Home Assistant local integration for IFU-WF air conditioners"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "homeassistant==2026.11.1",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
